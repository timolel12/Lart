<div class="result-container">
  <img [src]="image" alt="Result image" class="result-image" />

  <h1 class="result-title">
    {{ title }}
  </h1>

  <p class="result-message">
    {{ message }}
  </p>

  <a mat-raised-button [routerLink]="buttonLink" class="primary-button">
    {{ buttonLabel }}
  </a>
</div>
